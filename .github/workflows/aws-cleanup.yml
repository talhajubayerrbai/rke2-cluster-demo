name: AWS Infrastructure Cleanup — Full Linear Run

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git revision (UDAP internal)'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run identifier (UDAP internal)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DEFAULT_VPC: vpc-08750793f051e477b
  VPC1: vpc-044a1d577502cb21f
  VPC2: vpc-06f8e83384de631d6
  VPC3: vpc-0818d68617434d141
  S3_BUCKET: udap-calculator-tf-state-a7f3k9

jobs:
  cleanup:
    name: "Full AWS Cleanup — All Phases"
    runs-on: ubuntu-latest

    steps:

      # ── STEP 1: Verify AWS identity ─────────────────────────────────────
      - name: "Step 1 — Verify AWS identity"
        run: |
          set -e
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity
          echo "Region: $AWS_REGION"
          echo "Default VPC (NEVER TOUCH): $DEFAULT_VPC"

      # ── STEP 2: Describe non-terminated EC2 instances ───────────────────
      - name: "Step 2 — Describe non-terminated EC2 instances"
        run: |
          set -e
          echo "=== NON-TERMINATED EC2 INSTANCES ==="
          aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --query 'Reservations[].Instances[].{InstanceId:InstanceId,Type:InstanceType,State:State.Name,VpcId:VpcId,Tags:Tags}' \
            --output json

      # ── STEP 3: Terminate rke2 EC2 instances ────────────────────────────
      # AWS-side tag filter avoids JMESPath contains(null) on tagless instances
      - name: "Step 3 — Terminate rke2 EC2 instances"
        run: |
          set -e
          echo "=== AUTO-DISCOVERING rke2 INSTANCES BY Name TAG (AWS filter) ==="
          IDS=$(aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              "Name=tag:Name,Values=*rke2*" \
            --query 'Reservations[].Instances[?VpcId!=`'"$DEFAULT_VPC"'`].InstanceId' \
            --output text)
          echo "Instances to terminate: ${IDS:-none}"
          if [ -z "$IDS" ]; then
            echo "No rke2 instances found — skipping termination."
          else
            echo "=== PRE-TERMINATION STATE ==="
            aws ec2 describe-instances --region $AWS_REGION --instance-ids $IDS \
              --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name,Tags:Tags}' \
              --output json
            echo "=== TERMINATING ==="
            aws ec2 terminate-instances --region $AWS_REGION --instance-ids $IDS --output json
            echo "Termination initiated for: $IDS"
          fi

      # ── STEP 4: Wait for EC2 termination ────────────────────────────────
      - name: "Step 4 — Wait for rke2 instances to reach terminated state"
        run: |
          set -e
          echo "=== DISCOVERING rke2 INSTANCES IN shutting-down OR terminated STATE ==="
          IDS=$(aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters \
              "Name=instance-state-name,Values=shutting-down,terminated" \
              "Name=tag:Name,Values=*rke2*" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          echo "Waiting on: ${IDS:-none}"
          if [ -z "$IDS" ]; then
            echo "No rke2 instances in shutting-down/terminated state — nothing to wait for."
          else
            aws ec2 wait instance-terminated --region $AWS_REGION --instance-ids $IDS
            echo "=== CONFIRMED TERMINATED ==="
            aws ec2 describe-instances --region $AWS_REGION --instance-ids $IDS \
              --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name}' --output json
          fi

      # ── STEP 5: ALB cleanup ──────────────────────────────────────────────
      - name: "Step 5 — ALB cleanup (listeners → ALB → target groups)"
        run: |
          set -e
          echo "=== DISCOVERING rke2-* ALBs ==="
          ALB_ARNS=$(aws elbv2 describe-load-balancers --region $AWS_REGION \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].LoadBalancerArn' --output text)
          echo "ALB ARNs: ${ALB_ARNS:-none}"
          for ALB_ARN in $ALB_ARNS; do
            echo "-- Processing ALB: $ALB_ARN --"
            LISTENER_ARNS=$(aws elbv2 describe-listeners --region $AWS_REGION \
              --load-balancer-arn $ALB_ARN --query 'Listeners[].ListenerArn' --output text)
            for LISTENER_ARN in $LISTENER_ARNS; do
              aws elbv2 delete-listener --region $AWS_REGION --listener-arn $LISTENER_ARN 2>/dev/null || true
              echo "DELETED listener: $LISTENER_ARN"
            done
            aws elbv2 delete-load-balancer --region $AWS_REGION --load-balancer-arn $ALB_ARN 2>/dev/null || true
            echo "DELETED ALB: $ALB_ARN"
          done
          echo "Sleeping 30s for ALB deletion to propagate..."
          sleep 30
          echo "=== DISCOVERING rke2/ingress TARGET GROUPS ==="
          TG_ARNS=$(aws elbv2 describe-target-groups --region $AWS_REGION \
            --query 'TargetGroups[?contains(TargetGroupName,`ingress`) || contains(TargetGroupName,`rke2`)].TargetGroupArn' \
            --output text)
          echo "TG ARNs: ${TG_ARNS:-none}"
          for TG_ARN in $TG_ARNS; do
            aws elbv2 delete-target-group --region $AWS_REGION --target-group-arn $TG_ARN 2>/dev/null || true
            echo "DELETED target group: $TG_ARN"
          done

      # ── STEP 6: SG cleanup ───────────────────────────────────────────────
      - name: "Step 6 — Security group cleanup (rke2-*, skip default VPC)"
        run: |
          set -e
          echo "=== DISCOVERING rke2-* SGs BY NAME ==="
          NAME_SGS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=group-name,Values=rke2-*" \
            --query 'SecurityGroups[?VpcId!=`'"$DEFAULT_VPC"'` && GroupName!=`default`].GroupId' \
            --output text)
          echo "=== DISCOVERING rke2-* SGs BY TAG ==="
          TAG_SGS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=tag:Name,Values=rke2-*" \
            --query 'SecurityGroups[?VpcId!=`'"$DEFAULT_VPC"'` && GroupName!=`default`].GroupId' \
            --output text)
          ALL_SGS=$(echo "$NAME_SGS $TAG_SGS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "SGs to delete: ${ALL_SGS:-none}"
          for SG_ID in $ALL_SGS; do
            echo "-- Revoking rules on $SG_ID --"
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null || echo '[]')
            if [ "$INGRESS" != "[]" ] && [ -n "$INGRESS" ] && [ "$INGRESS" != "null" ]; then
              aws ec2 revoke-security-group-ingress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true
            fi
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissionsEgress' --output json 2>/dev/null || echo '[]')
            if [ "$EGRESS" != "[]" ] && [ -n "$EGRESS" ] && [ "$EGRESS" != "null" ]; then
              aws ec2 revoke-security-group-egress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$EGRESS" 2>/dev/null || true
            fi
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID 2>/dev/null || true
            echo "DELETED SG: $SG_ID"
          done

      # ── STEP 7: Key pair cleanup ─────────────────────────────────────────
      - name: "Step 7 — Key pair cleanup (rke2*)"
        run: |
          set -e
          echo "=== DISCOVERING rke2* KEY PAIRS ==="
          KP_NAMES=$(aws ec2 describe-key-pairs --region $AWS_REGION \
            --filters "Name=key-name,Values=rke2*" \
            --query 'KeyPairs[].KeyName' --output text)
          echo "Key pairs: ${KP_NAMES:-none}"
          for KP_NAME in $KP_NAMES; do
            aws ec2 delete-key-pair --region $AWS_REGION --key-name $KP_NAME 2>/dev/null || true
            echo "DELETED key pair: $KP_NAME"
          done

      # ── STEP 8: EBS volume cleanup ───────────────────────────────────────
      - name: "Step 8 — EBS volume cleanup (available, rke2-* or calculator-*)"
        run: |
          set -e
          echo "=== ALL AVAILABLE EBS VOLUMES ==="
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --query 'Volumes[].{ID:VolumeId,Size:Size,AZ:AvailabilityZone,Tags:Tags}' --output json
          RKE2_VOLS=$(aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" "Name=tag:Name,Values=rke2-*" \
            --query 'Volumes[].VolumeId' --output text)
          CALC_VOLS=$(aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" "Name=tag:Name,Values=calculator-*" \
            --query 'Volumes[].VolumeId' --output text)
          ALL_VOLS=$(echo "$RKE2_VOLS $CALC_VOLS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "Volumes to delete: ${ALL_VOLS:-none}"
          for VOL_ID in $ALL_VOLS; do
            aws ec2 delete-volume --region $AWS_REGION --volume-id $VOL_ID 2>/dev/null || true
            echo "DELETED volume: $VOL_ID"
          done

      # ── STEP 9: EIP cleanup ──────────────────────────────────────────────
      - name: "Step 9 — EIP cleanup (release all unassociated)"
        run: |
          set -e
          echo "=== ALL EIPs ==="
          aws ec2 describe-addresses --region $AWS_REGION --output json
          ALLOC_IDS=$(aws ec2 describe-addresses --region $AWS_REGION \
            --query 'Addresses[?!AssociationId].AllocationId' --output text)
          echo "Unassociated EIPs: ${ALLOC_IDS:-none}"
          for ALLOC_ID in $ALLOC_IDS; do
            aws ec2 release-address --region $AWS_REGION --allocation-id $ALLOC_ID 2>/dev/null || true
            echo "RELEASED EIP: $ALLOC_ID"
          done

      # ── STEP 10: IAM cleanup ─────────────────────────────────────────────
      - name: "Step 10 — IAM cleanup (rke2-*/calculator-* roles)"
        run: |
          set -e
          echo "=== DISCOVERING IAM ROLES ==="
          ROLES=$(aws iam list-roles \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].RoleName' \
            --output text)
          echo "Roles to clean up: ${ROLES:-none}"
          for ROLE in $ROLES; do
            echo "=== Processing role: $ROLE ==="
            MANAGED=$(aws iam list-attached-role-policies --role-name $ROLE \
              --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
            for PA in $MANAGED; do
              aws iam detach-role-policy --role-name $ROLE --policy-arn $PA 2>/dev/null || true
              echo "  DETACHED managed policy: $PA"
            done
            INLINE=$(aws iam list-role-policies --role-name $ROLE \
              --query 'PolicyNames[]' --output text 2>/dev/null || true)
            for PN in $INLINE; do
              aws iam delete-role-policy --role-name $ROLE --policy-name $PN 2>/dev/null || true
              echo "  DELETED inline policy: $PN"
            done
            PROFILES=$(aws iam list-instance-profiles-for-role --role-name $ROLE \
              --query 'InstanceProfiles[].InstanceProfileName' --output text 2>/dev/null || true)
            for PFN in $PROFILES; do
              aws iam remove-role-from-instance-profile \
                --instance-profile-name $PFN --role-name $ROLE 2>/dev/null || true
              echo "  REMOVED from instance profile: $PFN"
              aws iam delete-instance-profile --instance-profile-name $PFN 2>/dev/null || true
              echo "  DELETED instance profile: $PFN"
            done
            aws iam delete-role --role-name $ROLE 2>/dev/null || true
            echo "  DELETED ROLE: $ROLE"
          done

      # ── STEP 11: VPC summary (read-only gate inventory) ──────────────────
      - name: "Step 11 — VPC pre-deletion summary"
        run: |
          set -e
          echo "=== PRE-VPC-DELETION GATE SUMMARY ==="
          echo "Default VPC (PROTECTED, NEVER TOUCHED): $DEFAULT_VPC"
          echo ""
          for VPC_ID in $VPC1 $VPC2 $VPC3; do
            echo "────────────────────────────────────────"
            echo "VPC: $VPC_ID"
            aws ec2 describe-vpcs --region $AWS_REGION --vpc-ids $VPC_ID \
              --query 'Vpcs[0].{ID:VpcId,CIDR:CidrBlock,IsDefault:IsDefault}' --output json 2>/dev/null || echo "  VPC not found"
            echo "  Subnets:"
            aws ec2 describe-subnets --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[].{ID:SubnetId,CIDR:CidrBlock,AZ:AvailabilityZone}' --output json 2>/dev/null || true
            echo "  Internet Gateways:"
            aws ec2 describe-internet-gateways --region $AWS_REGION \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[].InternetGatewayId' --output json 2>/dev/null || true
            echo "  Route Tables:"
            aws ec2 describe-route-tables --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'RouteTables[].{ID:RouteTableId,Main:Associations[?Main==`true`]|[0].Main}' --output json 2>/dev/null || true
            echo "  Security Groups:"
            aws ec2 describe-security-groups --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[].{ID:GroupId,Name:GroupName}' --output json 2>/dev/null || true
            echo "  ENIs:"
            aws ec2 describe-network-interfaces --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'NetworkInterfaces[].{ID:NetworkInterfaceId,Status:Status,Description:Description}' --output json 2>/dev/null || true
          done
          echo "════════════════════════════════════════"
          echo "Proceeding to VPC deletion..."

      # ── Helper function — shared VPC delete logic ────────────────────────
      # Inlined per VPC below (GitHub Actions does not support shell functions across steps)

      # ── STEP 12: Delete VPC vpc-044a1d577502cb21f ────────────────────────
      - name: "Step 12 — Delete VPC vpc-044a1d577502cb21f (10.0.0.0/16)"
        run: |
          set -e
          VPC_ID="vpc-044a1d577502cb21f"
          echo "=== DELETING VPC: $VPC_ID ==="

          echo "-- Non-default security groups: revoke rules then delete --"
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true)
          for SG_ID in $SG_IDS; do
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null || echo '[]')
            if [ "$INGRESS" != "[]" ] && [ -n "$INGRESS" ] && [ "$INGRESS" != "null" ]; then
              aws ec2 revoke-security-group-ingress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true
            fi
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissionsEgress' --output json 2>/dev/null || echo '[]')
            if [ "$EGRESS" != "[]" ] && [ -n "$EGRESS" ] && [ "$EGRESS" != "null" ]; then
              aws ec2 revoke-security-group-egress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$EGRESS" 2>/dev/null || true
            fi
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID 2>/dev/null || true
            echo "DELETED SG: $SG_ID"
          done

          echo "-- Subnets --"
          SUBNET_IDS=$(aws ec2 describe-subnets --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true)
          for SUBNET_ID in $SUBNET_IDS; do
            aws ec2 delete-subnet --region $AWS_REGION --subnet-id $SUBNET_ID 2>/dev/null || true
            echo "DELETED subnet: $SUBNET_ID"
          done

          echo "-- Internet gateways --"
          IGW_IDS=$(aws ec2 describe-internet-gateways --region $AWS_REGION \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true)
          for IGW_ID in $IGW_IDS; do
            aws ec2 detach-internet-gateway --region $AWS_REGION \
              --internet-gateway-id $IGW_ID --vpc-id $VPC_ID 2>/dev/null || true
            aws ec2 delete-internet-gateway --region $AWS_REGION \
              --internet-gateway-id $IGW_ID 2>/dev/null || true
            echo "DELETED IGW: $IGW_ID"
          done

          echo "-- Non-main route tables --"
          RT_IDS=$(aws ec2 describe-route-tables --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[?!Associations[?Main==`true`]].RouteTableId' --output text 2>/dev/null || true)
          for RT_ID in $RT_IDS; do
            aws ec2 delete-route-table --region $AWS_REGION --route-table-id $RT_ID 2>/dev/null || true
            echo "DELETED route table: $RT_ID"
          done

          echo "-- Orphaned ENIs (left by ALB/EKS/etc) --"
          ENI_IDS=$(aws ec2 describe-network-interfaces --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'NetworkInterfaces[?Status!=`in-use`].NetworkInterfaceId' --output text 2>/dev/null || true)
          for ENI_ID in $ENI_IDS; do
            aws ec2 delete-network-interface --region $AWS_REGION --network-interface-id $ENI_ID 2>/dev/null || true
            echo "DELETED ENI: $ENI_ID"
          done

          echo "-- Delete VPC --"
          aws ec2 delete-vpc --region $AWS_REGION --vpc-id $VPC_ID
          echo "DELETED VPC: $VPC_ID"

      # ── STEP 13: Delete VPC vpc-06f8e83384de631d6 ────────────────────────
      - name: "Step 13 — Delete VPC vpc-06f8e83384de631d6 (10.0.0.0/16)"
        run: |
          set -e
          VPC_ID="vpc-06f8e83384de631d6"
          echo "=== DELETING VPC: $VPC_ID ==="

          echo "-- Non-default security groups: revoke rules then delete --"
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true)
          for SG_ID in $SG_IDS; do
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null || echo '[]')
            if [ "$INGRESS" != "[]" ] && [ -n "$INGRESS" ] && [ "$INGRESS" != "null" ]; then
              aws ec2 revoke-security-group-ingress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true
            fi
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissionsEgress' --output json 2>/dev/null || echo '[]')
            if [ "$EGRESS" != "[]" ] && [ -n "$EGRESS" ] && [ "$EGRESS" != "null" ]; then
              aws ec2 revoke-security-group-egress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$EGRESS" 2>/dev/null || true
            fi
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID 2>/dev/null || true
            echo "DELETED SG: $SG_ID"
          done

          echo "-- Subnets --"
          SUBNET_IDS=$(aws ec2 describe-subnets --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true)
          for SUBNET_ID in $SUBNET_IDS; do
            aws ec2 delete-subnet --region $AWS_REGION --subnet-id $SUBNET_ID 2>/dev/null || true
            echo "DELETED subnet: $SUBNET_ID"
          done

          echo "-- Internet gateways --"
          IGW_IDS=$(aws ec2 describe-internet-gateways --region $AWS_REGION \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true)
          for IGW_ID in $IGW_IDS; do
            aws ec2 detach-internet-gateway --region $AWS_REGION \
              --internet-gateway-id $IGW_ID --vpc-id $VPC_ID 2>/dev/null || true
            aws ec2 delete-internet-gateway --region $AWS_REGION \
              --internet-gateway-id $IGW_ID 2>/dev/null || true
            echo "DELETED IGW: $IGW_ID"
          done

          echo "-- Non-main route tables --"
          RT_IDS=$(aws ec2 describe-route-tables --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[?!Associations[?Main==`true`]].RouteTableId' --output text 2>/dev/null || true)
          for RT_ID in $RT_IDS; do
            aws ec2 delete-route-table --region $AWS_REGION --route-table-id $RT_ID 2>/dev/null || true
            echo "DELETED route table: $RT_ID"
          done

          echo "-- Orphaned ENIs --"
          ENI_IDS=$(aws ec2 describe-network-interfaces --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'NetworkInterfaces[?Status!=`in-use`].NetworkInterfaceId' --output text 2>/dev/null || true)
          for ENI_ID in $ENI_IDS; do
            aws ec2 delete-network-interface --region $AWS_REGION --network-interface-id $ENI_ID 2>/dev/null || true
            echo "DELETED ENI: $ENI_ID"
          done

          echo "-- Delete VPC --"
          aws ec2 delete-vpc --region $AWS_REGION --vpc-id $VPC_ID
          echo "DELETED VPC: $VPC_ID"

      # ── STEP 14: Delete VPC vpc-0818d68617434d141 ────────────────────────
      - name: "Step 14 — Delete VPC vpc-0818d68617434d141 (10.42.0.0/16)"
        run: |
          set -e
          VPC_ID="vpc-0818d68617434d141"
          echo "=== DELETING VPC: $VPC_ID ==="

          echo "-- Non-default security groups: revoke rules then delete --"
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true)
          for SG_ID in $SG_IDS; do
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null || echo '[]')
            if [ "$INGRESS" != "[]" ] && [ -n "$INGRESS" ] && [ "$INGRESS" != "null" ]; then
              aws ec2 revoke-security-group-ingress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true
            fi
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissionsEgress' --output json 2>/dev/null || echo '[]')
            if [ "$EGRESS" != "[]" ] && [ -n "$EGRESS" ] && [ "$EGRESS" != "null" ]; then
              aws ec2 revoke-security-group-egress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$EGRESS" 2>/dev/null || true
            fi
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID 2>/dev/null || true
            echo "DELETED SG: $SG_ID"
          done

          echo "-- Subnets --"
          SUBNET_IDS=$(aws ec2 describe-subnets --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true)
          for SUBNET_ID in $SUBNET_IDS; do
            aws ec2 delete-subnet --region $AWS_REGION --subnet-id $SUBNET_ID 2>/dev/null || true
            echo "DELETED subnet: $SUBNET_ID"
          done

          echo "-- Internet gateways --"
          IGW_IDS=$(aws ec2 describe-internet-gateways --region $AWS_REGION \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true)
          for IGW_ID in $IGW_IDS; do
            aws ec2 detach-internet-gateway --region $AWS_REGION \
              --internet-gateway-id $IGW_ID --vpc-id $VPC_ID 2>/dev/null || true
            aws ec2 delete-internet-gateway --region $AWS_REGION \
              --internet-gateway-id $IGW_ID 2>/dev/null || true
            echo "DELETED IGW: $IGW_ID"
          done

          echo "-- Non-main route tables --"
          RT_IDS=$(aws ec2 describe-route-tables --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[?!Associations[?Main==`true`]].RouteTableId' --output text 2>/dev/null || true)
          for RT_ID in $RT_IDS; do
            aws ec2 delete-route-table --region $AWS_REGION --route-table-id $RT_ID 2>/dev/null || true
            echo "DELETED route table: $RT_ID"
          done

          echo "-- Orphaned ENIs --"
          ENI_IDS=$(aws ec2 describe-network-interfaces --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'NetworkInterfaces[?Status!=`in-use`].NetworkInterfaceId' --output text 2>/dev/null || true)
          for ENI_ID in $ENI_IDS; do
            aws ec2 delete-network-interface --region $AWS_REGION --network-interface-id $ENI_ID 2>/dev/null || true
            echo "DELETED ENI: $ENI_ID"
          done

          echo "-- Delete VPC --"
          aws ec2 delete-vpc --region $AWS_REGION --vpc-id $VPC_ID
          echo "DELETED VPC: $VPC_ID"

      # ── STEP 15: S3 cleanup ──────────────────────────────────────────────
      - name: "Step 15 — S3 cleanup (empty and delete udap-calculator-tf-state-a7f3k9)"
        run: |
          set -e
          BUCKET="udap-calculator-tf-state-a7f3k9"
          echo "=== S3 BUCKET: $BUCKET ==="
          aws s3api get-bucket-versioning --bucket $BUCKET 2>/dev/null || echo "Bucket may not exist"
          echo "-- Deleting object versions in batches --"
          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket $BUCKET --max-items 1000 \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null || echo '{"Objects":null}')
            COUNT=$(echo "$VERSIONS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))" 2>/dev/null || echo 0)
            echo "Version batch count: $COUNT"
            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then break; fi
            aws s3api delete-objects --bucket $BUCKET --delete "$VERSIONS" --output json
            echo "  Deleted $COUNT object versions."
          done
          echo "-- Deleting delete markers in batches --"
          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket $BUCKET --max-items 1000 \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null || echo '{"Objects":null}')
            COUNT=$(echo "$MARKERS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))" 2>/dev/null || echo 0)
            echo "Delete marker batch count: $COUNT"
            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then break; fi
            aws s3api delete-objects --bucket $BUCKET --delete "$MARKERS" --output json
            echo "  Deleted $COUNT delete markers."
          done
          echo "-- Verifying bucket is empty --"
          aws s3api list-object-versions --bucket $BUCKET --output json 2>/dev/null || true
          echo "-- Deleting bucket --"
          aws s3api delete-bucket --bucket $BUCKET --region $AWS_REGION
          echo "DELETED BUCKET: $BUCKET"

      # ── STEP 16: Final sweep ─────────────────────────────────────────────
      - name: "Step 16 — Final sweep (confirm zero orphaned resources)"
        run: |
          echo "=== FINAL SWEEP ==="
          echo "--- EC2 (non-terminated, Name tag matches rke2 or calculator) ---"
          aws ec2 describe-instances --region $AWS_REGION \
            --filters \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              "Name=tag:Name,Values=*rke2*,*calculator*" \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name,Tags:Tags}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- ALBs (rke2-*) ---"
          aws elbv2 describe-load-balancers --region $AWS_REGION \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].{Name:LoadBalancerName,ARN:LoadBalancerArn}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- Target groups (rke2/ingress) ---"
          aws elbv2 describe-target-groups --region $AWS_REGION \
            --query 'TargetGroups[?contains(TargetGroupName,`rke2`) || contains(TargetGroupName,`ingress`)].{Name:TargetGroupName}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- Security groups (non-default VPC, non-default named) ---"
          aws ec2 describe-security-groups --region $AWS_REGION \
            --query 'SecurityGroups[?VpcId!=`'"$DEFAULT_VPC"'` && GroupName!=`default`].{ID:GroupId,Name:GroupName,VPC:VpcId}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- Key pairs (rke2*) ---"
          aws ec2 describe-key-pairs --region $AWS_REGION \
            --filters "Name=key-name,Values=rke2*" \
            --query 'KeyPairs[].KeyName' --output json 2>/dev/null || echo "[]"
          echo "--- Available EBS volumes ---"
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --query 'Volumes[].{ID:VolumeId,Size:Size,Tags:Tags}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- Unassociated EIPs ---"
          aws ec2 describe-addresses --region $AWS_REGION \
            --query 'Addresses[?!AssociationId].{AllocationId:AllocationId,PublicIP:PublicIp}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- IAM roles (rke2/calculator) ---"
          aws iam list-roles \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].RoleName' \
            --output json 2>/dev/null || echo "[]"
          echo "--- ALL VPCs (expect only default vpc-08750793f051e477b) ---"
          aws ec2 describe-vpcs --region $AWS_REGION \
            --query 'Vpcs[].{ID:VpcId,CIDR:CidrBlock,IsDefault:IsDefault}' \
            --output json 2>/dev/null || echo "[]"
          echo "--- VPC count ---"
          VPC_COUNT=$(aws ec2 describe-vpcs --region $AWS_REGION \
            --query 'length(Vpcs)' --output text 2>/dev/null || echo "unknown")
          echo "Total VPC count: $VPC_COUNT (expected: 1)"
          echo "--- S3 buckets (calculator/rke2) ---"
          aws s3api list-buckets \
            --query 'Buckets[?contains(Name,`calculator`) || contains(Name,`rke2`)].{Name:Name}' \
            --output json 2>/dev/null || echo "[]"
          echo "=== SWEEP COMPLETE ==="
          echo "Live URL: cleanup://complete"
