      # ────────────────────────────────────────────────────────────────────
      # S3 CLEANUP — empty and delete udap-calculator-tf-state-a7f3k9
      # ────────────────────────────────────────────────────────────────────
      - name: "[s3_cleanup] Empty and delete S3 state bucket"
        if: env.EFFECTIVE_PHASE == 's3_cleanup'
        run: |
          BUCKET="udap-calculator-tf-state-a7f3k9"
          echo "=== S3 BUCKET CLEANUP: $BUCKET ==="
          aws s3api get-bucket-versioning --bucket $BUCKET
          echo "-- Deleting all object versions --"
          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket $BUCKET --max-items 1000 \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "$VERSIONS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))" 2>/dev/null || echo 0)
            echo "Version batch: $COUNT"
            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then break; fi
            aws s3api delete-objects --bucket $BUCKET --delete "$VERSIONS" --output json
            echo "  Deleted $COUNT versions."
          done
          echo "-- Deleting all delete markers --"
          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket $BUCKET --max-items 1000 \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "$MARKERS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))" 2>/dev/null || echo 0)
            echo "Delete marker batch: $COUNT"
            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then break; fi
            aws s3api delete-objects --bucket $BUCKET --delete "$MARKERS" --output json
            echo "  Deleted $COUNT markers."
          done
          echo "-- Verifying empty --"
          aws s3api list-object-versions --bucket $BUCKET --output json
          echo "-- Deleting bucket --"
          aws s3api delete-bucket --bucket $BUCKET --region $AWS_REGION
          echo "DELETED BUCKET: $BUCKET"
          echo "Live URL: s3-deleted://udap-calculator-tf-state-a7f3k9"

