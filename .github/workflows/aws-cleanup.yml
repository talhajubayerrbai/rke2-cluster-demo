            --query 'Reservations[].Instances[?contains(Tags[?Key==`Name`]|[0].Value,`rke2`) || contains(Tags[?Key==`Name`]|[0].Value,`calculator`)].{ID:InstanceId,State:State.Name,Name:Tags[?Key==`Name`]|[0].Value}' \
            --output table

          echo ""
          echo "=== ALBs (rke2-*) ==="
          aws elbv2 describe-load-balancers --region $AWS_REGION \
