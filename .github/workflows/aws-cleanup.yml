name: AWS Infrastructure Cleanup

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Which phase to run'
        required: true
        default: 'inventory'
        type: choice
        options:
          - inventory
          - terminate_ec2
          - wait_ec2_terminated
          - alb_cleanup
          - sg_cleanup
          - keypair_cleanup
          - ebs_cleanup
          - eip_cleanup
          - iam_cleanup
          - vpc_summary
          - vpc_delete_044a1d577502cb21f
          - vpc_delete_06f8e83384de631d6
          - vpc_delete_0818d68617434d141
          - s3_cleanup
          - final_sweep
      instance_ids:
        description: 'Space-separated EC2 instance IDs (for terminate_ec2 and wait phases)'
        required: false
        default: ''
      revision:
        description: 'Git revision'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run identifier'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DEFAULT_VPC: vpc-08750793f051e477b

jobs:
  cleanup:
    name: "AWS Cleanup — ${{ inputs.phase }}"
    runs-on: ubuntu-latest

    steps:
      - name: Verify AWS identity
        run: |
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity
          echo "Region: $AWS_REGION"

      # ────────────────────────────────────────────────────────────────────
      # INVENTORY — read-only: show all non-terminated EC2 instances
      # ────────────────────────────────────────────────────────────────────
      - name: "[inventory] Describe non-terminated EC2 instances"
        if: inputs.phase == 'inventory'
        run: |
          echo "=== NON-TERMINATED EC2 INSTANCES (us-east-1) ==="
          aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --output table \
            --query 'Reservations[].Instances[].{
              InstanceId:InstanceId,
              Type:InstanceType,
              State:State.Name,
              LaunchTime:LaunchTime,
              VPC:VpcId,
              Name:Tags[?Key==`Name`]|[0].Value,
              Project:Tags[?Key==`Project`]|[0].Value,
              Role:Tags[?Key==`Role`]|[0].Value
            }'

          echo ""
          echo "=== FULL TAG LISTING FOR EACH INSTANCE ==="
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          for ID in $INSTANCE_IDS; do
            echo "--- $ID ---"
            aws ec2 describe-instances \
              --region $AWS_REGION \
              --instance-ids $ID \
              --query 'Reservations[0].Instances[0].Tags' \
              --output table
          done

          echo ""
          echo "=== ALBs (rke2-*) ==="
          aws elbv2 describe-load-balancers --region $AWS_REGION --output table \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].{Name:LoadBalancerName,ARN:LoadBalancerArn,State:State.Code,DNS:DNSName}'

          echo ""
          echo "=== TARGET GROUPS ==="
          aws elbv2 describe-target-groups --region $AWS_REGION --output table \
            --query 'TargetGroups[].{Name:TargetGroupName,ARN:TargetGroupArn,Protocol:Protocol,Port:Port}'

          echo ""
          echo "=== SECURITY GROUPS (non-default, non-default-VPC) ==="
          aws ec2 describe-security-groups --region $AWS_REGION --output table \
            --query 'SecurityGroups[?GroupName!=`default` && VpcId!=`vpc-08750793f051e477b`].{ID:GroupId,Name:GroupName,VPC:VpcId,Desc:Description}'

          echo ""
          echo "=== KEY PAIRS (rke2-*) ==="
          aws ec2 describe-key-pairs --region $AWS_REGION --output table \
            --query 'KeyPairs[?contains(KeyName,`rke2`) || contains(KeyName,`calculator`)].{ID:KeyPairId,Name:KeyName,Created:CreateTime}'

          echo ""
          echo "=== EBS VOLUMES (available) ==="
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --output table \
            --query 'Volumes[].{ID:VolumeId,Size:Size,State:State,AZ:AvailabilityZone,Tags:Tags}'

          echo ""
          echo "=== ELASTIC IPs (unassociated) ==="
          aws ec2 describe-addresses --region $AWS_REGION --output table \
            --query 'Addresses[?!AssociationId].{AllocationId:AllocationId,PublicIP:PublicIp,Domain:Domain}'

          echo ""
          echo "=== IAM ROLES (rke2-* or calculator-*) ==="
          aws iam list-roles --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].{Name:RoleName,ARN:Arn,Created:CreateDate}' --output table

          echo ""
          echo "=== VPCs (non-default) ==="
          aws ec2 describe-vpcs --region $AWS_REGION --output table \
            --query 'Vpcs[?IsDefault==`false`].{ID:VpcId,CIDR:CidrBlock,IsDefault:IsDefault}'

          echo ""
          echo "=== S3 BUCKET ==="
          aws s3api list-buckets --query 'Buckets[?contains(Name,`calculator`) || contains(Name,`rke2`)].{Name:Name,Created:CreationDate}' --output table

          echo ""
          echo "INVENTORY COMPLETE — review above before approving termination."

      # ────────────────────────────────────────────────────────────────────
      # TERMINATE EC2 — requires instance_ids input
      # ────────────────────────────────────────────────────────────────────
      - name: "[terminate_ec2] Terminate rke2-server and rke2-agent instances"
        if: inputs.phase == 'terminate_ec2'
        run: |
          IDS="${{ inputs.instance_ids }}"
          if [ -z "$IDS" ]; then
            echo "Auto-discovering rke2-tagged instances..."
            IDS=$(aws ec2 describe-instances \
              --region $AWS_REGION \
              --filters \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
                "Name=tag-key,Values=Name" \
              --query 'Reservations[].Instances[?contains(Tags[?Key==`Name`]|[0].Value,`rke2`)].InstanceId' \
              --output text)
          fi
          echo "Instances to terminate: $IDS"
          if [ -z "$IDS" ]; then
            echo "No rke2 instances found. Nothing to terminate."
            exit 0
          fi
          echo "=== PRE-TERMINATION STATE ==="
          for ID in $IDS; do
            aws ec2 describe-instances --region $AWS_REGION --instance-ids $ID \
              --query 'Reservations[0].Instances[0].{ID:InstanceId,State:State.Name,Tags:Tags}' \
              --output json
          done
          echo "=== TERMINATING ==="
          aws ec2 terminate-instances --region $AWS_REGION --instance-ids $IDS --output json
          echo "Termination initiated for: $IDS"
          echo "TERMINATED_IDS=$IDS" >> $GITHUB_ENV

      # ────────────────────────────────────────────────────────────────────
      # WAIT EC2 TERMINATED
      # ────────────────────────────────────────────────────────────────────
      - name: "[wait_ec2_terminated] Wait for instances to reach terminated state"
        if: inputs.phase == 'wait_ec2_terminated'
        run: |
          IDS="${{ inputs.instance_ids }}"
          if [ -z "$IDS" ]; then
            echo "Discovering terminated/shutting-down rke2 instances..."
            IDS=$(aws ec2 describe-instances \
              --region $AWS_REGION \
              --filters \
                "Name=instance-state-name,Values=shutting-down,terminated" \
                "Name=tag-key,Values=Name" \
              --query 'Reservations[].Instances[?contains(Tags[?Key==`Name`]|[0].Value,`rke2`)].InstanceId' \
              --output text)
          fi
          echo "Waiting for termination of: $IDS"
          aws ec2 wait instance-terminated --region $AWS_REGION --instance-ids $IDS
          echo "=== CONFIRMED TERMINATED ==="
          for ID in $IDS; do
            aws ec2 describe-instances --region $AWS_REGION --instance-ids $ID \
              --query 'Reservations[0].Instances[0].{ID:InstanceId,State:State.Name}' \
              --output table
          done
          echo "Live URL: instances-terminated://confirmed"

      # ────────────────────────────────────────────────────────────────────
      # ALB CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[alb_cleanup] Delete ALB listeners, ALB, and ingress target group"
        if: inputs.phase == 'alb_cleanup'
        run: |
          echo "=== DISCOVERING ALBs ==="
          ALB_ARNS=$(aws elbv2 describe-load-balancers --region $AWS_REGION \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].LoadBalancerArn' \
            --output text)
          echo "ALB ARNs: $ALB_ARNS"

          for ALB_ARN in $ALB_ARNS; do
            echo "--- Processing ALB: $ALB_ARN ---"
            LISTENER_ARNS=$(aws elbv2 describe-listeners --region $AWS_REGION \
              --load-balancer-arn $ALB_ARN \
              --query 'Listeners[].ListenerArn' \
              --output text)
            echo "Listeners: $LISTENER_ARNS"
            for LISTENER_ARN in $LISTENER_ARNS; do
              echo "Deleting listener: $LISTENER_ARN"
              aws elbv2 delete-listener --region $AWS_REGION --listener-arn $LISTENER_ARN
              echo "  Deleted: $LISTENER_ARN"
            done
            echo "Deleting ALB: $ALB_ARN"
            aws elbv2 delete-load-balancer --region $AWS_REGION --load-balancer-arn $ALB_ARN
            echo "  Deleted ALB: $ALB_ARN"
          done

          if [ -z "$ALB_ARNS" ]; then
            echo "No rke2-* ALBs found."
          fi

          echo "=== WAITING FOR ALB DELETION TO SETTLE ==="
          sleep 30

          echo "=== DELETING TARGET GROUPS ==="
          TG_ARNS=$(aws elbv2 describe-target-groups --region $AWS_REGION \
            --query 'TargetGroups[?contains(TargetGroupName,`ingress`) || contains(TargetGroupName,`rke2`)].TargetGroupArn' \
            --output text)
          echo "Target group ARNs: $TG_ARNS"
          for TG_ARN in $TG_ARNS; do
            echo "Deleting target group: $TG_ARN"
            aws elbv2 delete-target-group --region $AWS_REGION --target-group-arn $TG_ARN
            echo "  Deleted: $TG_ARN"
          done

          if [ -z "$TG_ARNS" ]; then
            echo "No ingress/rke2 target groups found."
          fi

          echo "=== ALB CLEANUP COMPLETE ==="
          echo "Live URL: alb-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # SECURITY GROUP CLEANUP (rke2-*, skip default VPC and default SGs)
      # ────────────────────────────────────────────────────────────────────
      - name: "[sg_cleanup] Delete rke2-* security groups (skip default VPC)"
        if: inputs.phase == 'sg_cleanup'
        run: |
          echo "=== DISCOVERING RKE2 SECURITY GROUPS ==="
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=group-name,Values=rke2-*" \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b` && GroupName!=`default`].GroupId' \
            --output text)

          echo "SGs to delete (name-filtered rke2-*): $SG_IDS"

          # Also find by tag
          TAG_SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=tag:Name,Values=rke2-*" \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b` && GroupName!=`default`].GroupId' \
            --output text)
          echo "SGs to delete (tag-filtered rke2-*): $TAG_SG_IDS"

          ALL_SGS=$(echo "$SG_IDS $TAG_SG_IDS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Combined unique SGs: $ALL_SGS"

          for SG_ID in $ALL_SGS; do
            echo "--- Describing SG: $SG_ID ---"
            aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID \
              --query 'SecurityGroups[0].{ID:GroupId,Name:GroupName,VPC:VpcId}' \
              --output table

            # Revoke all ingress rules first (handles self-referencing rules)
            echo "Revoking ingress rules on $SG_ID..."
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID \
              --query 'SecurityGroups[0].IpPermissions' \
              --output json)
            if [ "$INGRESS" != "[]" ] && [ -n "$INGRESS" ]; then
              aws ec2 revoke-security-group-ingress --region $AWS_REGION \
                --group-id $SG_ID \
                --ip-permissions "$INGRESS" 2>/dev/null || echo "  (no ingress to revoke or already cleared)"
            fi

            # Revoke all egress rules
            echo "Revoking egress rules on $SG_ID..."
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID \
              --query 'SecurityGroups[0].IpPermissionsEgress' \
              --output json)
            if [ "$EGRESS" != "[]" ] && [ -n "$EGRESS" ]; then
              aws ec2 revoke-security-group-egress --region $AWS_REGION \
                --group-id $SG_ID \
                --ip-permissions "$EGRESS" 2>/dev/null || echo "  (no egress to revoke or already cleared)"
            fi

            echo "Deleting SG: $SG_ID"
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID
            echo "  Deleted: $SG_ID"
          done

          if [ -z "$ALL_SGS" ]; then
            echo "No rke2-* security groups found outside the default VPC."
          fi
          echo "=== SG CLEANUP COMPLETE ==="
          echo "Live URL: sg-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # KEY PAIR CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[keypair_cleanup] Delete rke2-* key pairs"
        if: inputs.phase == 'keypair_cleanup'
        run: |
          echo "=== DISCOVERING RKE2 KEY PAIRS ==="
          aws ec2 describe-key-pairs --region $AWS_REGION \
            --filters "Name=key-name,Values=rke2*" \
            --output table

          KP_NAMES=$(aws ec2 describe-key-pairs --region $AWS_REGION \
            --filters "Name=key-name,Values=rke2*" \
            --query 'KeyPairs[].KeyName' \
            --output text)
          echo "Key pairs to delete: $KP_NAMES"

          for KP_NAME in $KP_NAMES; do
            echo "Deleting key pair: $KP_NAME"
            aws ec2 delete-key-pair --region $AWS_REGION --key-name $KP_NAME
            echo "  Deleted: $KP_NAME"
          done

          if [ -z "$KP_NAMES" ]; then
            echo "No rke2-* key pairs found."
          fi
          echo "=== KEY PAIR CLEANUP COMPLETE ==="
          echo "Live URL: keypair-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # EBS VOLUME CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[ebs_cleanup] Delete available EBS volumes tagged rke2-* or calculator-*"
        if: inputs.phase == 'ebs_cleanup'
        run: |
          echo "=== DISCOVERING AVAILABLE EBS VOLUMES ==="

          # By tag Name rke2-*
          RKE2_VOLS=$(aws ec2 describe-volumes --region $AWS_REGION \
            --filters \
              "Name=status,Values=available" \
              "Name=tag:Name,Values=rke2-*" \
            --query 'Volumes[].VolumeId' \
            --output text)

          # By tag Name calculator-*
          CALC_VOLS=$(aws ec2 describe-volumes --region $AWS_REGION \
            --filters \
              "Name=status,Values=available" \
              "Name=tag:Name,Values=calculator-*" \
            --query 'Volumes[].VolumeId' \
            --output text)

          # Also get all available volumes and show them for context
          echo "=== ALL AVAILABLE VOLUMES ==="
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --output table \
            --query 'Volumes[].{ID:VolumeId,Size:Size,AZ:AvailabilityZone,Tags:Tags}'

          ALL_VOLS=$(echo "$RKE2_VOLS $CALC_VOLS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "Volumes to delete: $ALL_VOLS"

          for VOL_ID in $ALL_VOLS; do
            echo "Deleting volume: $VOL_ID"
            aws ec2 delete-volume --region $AWS_REGION --volume-id $VOL_ID
            echo "  Deleted: $VOL_ID"
          done

          if [ -z "$ALL_VOLS" ]; then
            echo "No tagged available EBS volumes found."
          fi
          echo "=== EBS CLEANUP COMPLETE ==="
          echo "Live URL: ebs-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # ELASTIC IP CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[eip_cleanup] Release unassociated Elastic IPs"
        if: inputs.phase == 'eip_cleanup'
        run: |
          echo "=== DISCOVERING UNASSOCIATED ELASTIC IPs ==="
          aws ec2 describe-addresses --region $AWS_REGION --output table

          ALLOC_IDS=$(aws ec2 describe-addresses --region $AWS_REGION \
            --query 'Addresses[?!AssociationId].AllocationId' \
            --output text)
          echo "Unassociated EIPs to release: $ALLOC_IDS"

          for ALLOC_ID in $ALLOC_IDS; do
            echo "Releasing EIP: $ALLOC_ID"
            aws ec2 release-address --region $AWS_REGION --allocation-id $ALLOC_ID
            echo "  Released: $ALLOC_ID"
          done

          if [ -z "$ALLOC_IDS" ]; then
            echo "No unassociated Elastic IPs found."
          fi
          echo "=== EIP CLEANUP COMPLETE ==="
          echo "Live URL: eip-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # IAM ROLE CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[iam_cleanup] Detach policies, remove from instance profiles, delete rke2-* and calculator-* IAM roles"
        if: inputs.phase == 'iam_cleanup'
        run: |
          echo "=== DISCOVERING IAM ROLES ==="
          ROLES=$(aws iam list-roles \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].RoleName' \
            --output text)
          echo "Roles found: $ROLES"

          if [ -z "$ROLES" ]; then
            echo "No rke2-* or calculator-* IAM roles found."
          fi

          for ROLE in $ROLES; do
            echo ""
            echo "=== Processing role: $ROLE ==="

            # 1. Detach managed policies
            MANAGED=$(aws iam list-attached-role-policies \
              --role-name $ROLE \
              --query 'AttachedPolicies[].PolicyArn' \
              --output text)
            for POLICY_ARN in $MANAGED; do
              echo "  Detaching managed policy: $POLICY_ARN"
              aws iam detach-role-policy --role-name $ROLE --policy-arn $POLICY_ARN
              echo "    Detached: $POLICY_ARN"
            done

            # 2. Delete inline policies
            INLINE=$(aws iam list-role-policies --role-name $ROLE --query 'PolicyNames[]' --output text)
            for POLICY_NAME in $INLINE; do
              echo "  Deleting inline policy: $POLICY_NAME"
              aws iam delete-role-policy --role-name $ROLE --policy-name $POLICY_NAME
              echo "    Deleted inline: $POLICY_NAME"
            done

            # 3. Remove from instance profiles
            PROFILES=$(aws iam list-instance-profiles-for-role \
              --role-name $ROLE \
              --query 'InstanceProfiles[].InstanceProfileName' \
              --output text)
            for PROFILE_NAME in $PROFILES; do
              echo "  Removing from instance profile: $PROFILE_NAME"
              aws iam remove-role-from-instance-profile \
                --instance-profile-name $PROFILE_NAME \
                --role-name $ROLE
              echo "    Removed from: $PROFILE_NAME"
              echo "  Deleting instance profile: $PROFILE_NAME"
              aws iam delete-instance-profile --instance-profile-name $PROFILE_NAME
              echo "    Deleted profile: $PROFILE_NAME"
            done

            # 4. Delete the role
            echo "  Deleting role: $ROLE"
            aws iam delete-role --role-name $ROLE
            echo "    DELETED ROLE: $ROLE"
          done

          echo "=== IAM CLEANUP COMPLETE ==="
          echo "Live URL: iam-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # VPC SUMMARY — gate before VPC deletion
      # ────────────────────────────────────────────────────────────────────
      - name: "[vpc_summary] Summary of all deletions so far; VPC inventory for gate"
        if: inputs.phase == 'vpc_summary'
        run: |
          echo "========================================================"
          echo "  PRE-VPC-DELETION SUMMARY — RESOURCES DELETED SO FAR"
          echo "========================================================"
          echo ""
          echo "=== REMAINING EC2 INSTANCES ==="
          aws ec2 describe-instances --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name,Name:Tags[?Key==`Name`]|[0].Value}' \
            --output table

          echo ""
          echo "=== REMAINING ALBs ==="
          aws elbv2 describe-load-balancers --region $AWS_REGION --output table \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].{Name:LoadBalancerName,State:State.Code}'

          echo ""
          echo "=== REMAINING TARGET GROUPS ==="
          aws elbv2 describe-target-groups --region $AWS_REGION --output table \
            --query 'TargetGroups[?contains(TargetGroupName,`ingress`) || contains(TargetGroupName,`rke2`)].{Name:TargetGroupName}'

          echo ""
          echo "=== REMAINING SECURITY GROUPS (non-default VPC) ==="
          aws ec2 describe-security-groups --region $AWS_REGION \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b`].{ID:GroupId,Name:GroupName,VPC:VpcId}' \
            --output table

          echo ""
          echo "=== REMAINING KEY PAIRS (rke2-*) ==="
          aws ec2 describe-key-pairs --region $AWS_REGION \
            --filters "Name=key-name,Values=rke2*" \
            --output table

          echo ""
          echo "=== REMAINING AVAILABLE EBS VOLUMES ==="
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --output table \
            --query 'Volumes[].{ID:VolumeId,Size:Size,Tags:Tags}'

          echo ""
          echo "=== REMAINING UNASSOCIATED EIPs ==="
          aws ec2 describe-addresses --region $AWS_REGION \
            --query 'Addresses[?!AssociationId].{AllocationId:AllocationId,PublicIP:PublicIp}' \
            --output table

          echo ""
          echo "=== REMAINING IAM ROLES (rke2-* calculator-*) ==="
          aws iam list-roles \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].RoleName' \
            --output table

          echo ""
          echo "========================================================"
          echo "  VPC INVENTORY — TARGETS FOR DELETION"
          echo "========================================================"
          for VPC_ID in vpc-044a1d577502cb21f vpc-06f8e83384de631d6 vpc-0818d68617434d141; do
            echo ""
            echo "--- VPC: $VPC_ID ---"
            aws ec2 describe-vpcs --region $AWS_REGION --vpc-ids $VPC_ID \
              --query 'Vpcs[0].{ID:VpcId,CIDR:CidrBlock,IsDefault:IsDefault}' \
              --output table 2>/dev/null || echo "VPC $VPC_ID not found (may already be deleted)"

            echo "  Subnets:"
            aws ec2 describe-subnets --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[].{ID:SubnetId,CIDR:CidrBlock,AZ:AvailabilityZone}' \
              --output table

            echo "  Internet Gateways:"
            aws ec2 describe-internet-gateways --region $AWS_REGION \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[].{ID:InternetGatewayId,State:Attachments[0].State}' \
              --output table

            echo "  Route Tables:"
            aws ec2 describe-route-tables --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'RouteTables[].{ID:RouteTableId,Main:Associations[?Main==`true`]|[0].Main}' \
              --output table

            echo "  Security Groups:"
            aws ec2 describe-security-groups --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[].{ID:GroupId,Name:GroupName}' \
              --output table
          done

          echo ""
          echo "DEFAULT VPC (DO NOT TOUCH): vpc-08750793f051e477b"
          echo "========================================================"
          echo "AWAITING HUMAN APPROVAL BEFORE VPC DELETION PROCEEDS"
          echo "Live URL: vpc-summary://ready-for-gate"

      # ────────────────────────────────────────────────────────────────────
      # VPC DELETE — vpc-044a1d577502cb21f (10.0.0.0/16)
      # ────────────────────────────────────────────────────────────────────
      - name: "[vpc_delete_044a1d577502cb21f] Delete VPC vpc-044a1d577502cb21f"
