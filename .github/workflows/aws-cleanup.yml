name: AWS Infrastructure Cleanup

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Which phase to run (overrides vars.CLEANUP_PHASE)'
        required: false
        default: ''
      instance_ids:
        description: 'Space-separated EC2 instance IDs (for terminate/wait phases)'
        required: false
        default: ''
      revision:
        description: 'Git revision'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run identifier'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DEFAULT_VPC: vpc-08750793f051e477b
  # Phase resolves: explicit input > repository variable > fallback 'inventory'
  EFFECTIVE_PHASE: ${{ inputs.phase != '' && inputs.phase || vars.CLEANUP_PHASE != '' && vars.CLEANUP_PHASE || 'inventory' }}
  EFFECTIVE_INSTANCE_IDS: ${{ inputs.instance_ids != '' && inputs.instance_ids || vars.CLEANUP_INSTANCE_IDS != '' && vars.CLEANUP_INSTANCE_IDS || '' }}

jobs:
  cleanup:
    name: "AWS Cleanup — phase=${{ inputs.phase != '' && inputs.phase || vars.CLEANUP_PHASE }}"
    runs-on: ubuntu-latest

    steps:
      - name: Verify AWS identity and resolve phase
        run: |
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity
          echo "Region: $AWS_REGION"
          echo "Effective phase: $EFFECTIVE_PHASE"
          echo "Effective instance IDs: $EFFECTIVE_INSTANCE_IDS"

      # ────────────────────────────────────────────────────────────────────
      # INVENTORY — read-only: show all non-terminated EC2 instances
      # ────────────────────────────────────────────────────────────────────
      - name: "[inventory] Describe non-terminated EC2 instances"
        if: env.EFFECTIVE_PHASE == 'inventory'
        run: |
          echo "=== NON-TERMINATED EC2 INSTANCES (us-east-1) ==="
          aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --output json \
            --query 'Reservations[].Instances[].{InstanceId:InstanceId,Type:InstanceType,State:State.Name,LaunchTime:LaunchTime,VPC:VpcId,Tags:Tags}'
          echo ""
          echo "=== ALBs ==="
          aws elbv2 describe-load-balancers --region $AWS_REGION --output json \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].{Name:LoadBalancerName,ARN:LoadBalancerArn,State:State.Code}'
          echo ""
          echo "=== TARGET GROUPS ==="
          aws elbv2 describe-target-groups --region $AWS_REGION --output json \
            --query 'TargetGroups[].{Name:TargetGroupName,ARN:TargetGroupArn}'
          echo ""
          echo "=== SECURITY GROUPS (non-default-VPC) ==="
          aws ec2 describe-security-groups --region $AWS_REGION --output json \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b`].{ID:GroupId,Name:GroupName,VPC:VpcId}'
          echo ""
          echo "=== KEY PAIRS (rke2*) ==="
          aws ec2 describe-key-pairs --region $AWS_REGION --output json \
            --query 'KeyPairs[?contains(KeyName,`rke2`) || contains(KeyName,`calculator`)].{ID:KeyPairId,Name:KeyName}'
          echo ""
          echo "=== EBS VOLUMES (available) ==="
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --output json \
            --query 'Volumes[].{ID:VolumeId,Size:Size,AZ:AvailabilityZone,Tags:Tags}'
          echo ""
          echo "=== ELASTIC IPs (unassociated) ==="
          aws ec2 describe-addresses --region $AWS_REGION --output json \
            --query 'Addresses[?!AssociationId].{AllocationId:AllocationId,PublicIP:PublicIp}'
          echo ""
          echo "=== IAM ROLES (rke2 or calculator) ==="
          aws iam list-roles --output json \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].{Name:RoleName,ARN:Arn,Created:CreateDate}'
          echo ""
          echo "=== VPCs (non-default) ==="
          aws ec2 describe-vpcs --region $AWS_REGION --output json \
            --query 'Vpcs[?IsDefault==`false`].{ID:VpcId,CIDR:CidrBlock}'
          echo ""
          echo "=== S3 BUCKETS (calculator or rke2) ==="
          aws s3api list-buckets --output json \
            --query 'Buckets[?contains(Name,`calculator`) || contains(Name,`rke2`)].{Name:Name,Created:CreationDate}'
          echo ""
          echo "INVENTORY COMPLETE"

      # ────────────────────────────────────────────────────────────────────
      # TERMINATE EC2 — requires instance_ids input or auto-discovery
      # ────────────────────────────────────────────────────────────────────
      - name: "[terminate_ec2] Terminate rke2-server and rke2-agent instances"
        if: env.EFFECTIVE_PHASE == 'terminate_ec2'
        run: |
          IDS="$EFFECTIVE_INSTANCE_IDS"
          if [ -z "$IDS" ]; then
            echo "Auto-discovering rke2-tagged instances..."
            IDS=$(aws ec2 describe-instances \
              --region $AWS_REGION \
              --filters \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[].Instances[?contains(Tags[?Key==`Name`]|[0].Value,`rke2`)].InstanceId' \
              --output text)
          fi
          echo "Instances to terminate: $IDS"
          if [ -z "$IDS" ]; then
            echo "No rke2 instances found. Nothing to terminate."
            exit 0
          fi
          echo "=== PRE-TERMINATION STATE ==="
          aws ec2 describe-instances --region $AWS_REGION --instance-ids $IDS \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name,Tags:Tags}' \
            --output json
          echo "=== TERMINATING ==="
          aws ec2 terminate-instances --region $AWS_REGION --instance-ids $IDS --output json
          echo "Termination initiated for: $IDS"
          echo "Live URL: ec2-terminating://$IDS"

      # ────────────────────────────────────────────────────────────────────
      # WAIT EC2 TERMINATED
      # ────────────────────────────────────────────────────────────────────
      - name: "[wait_ec2_terminated] Wait for instances to reach terminated state"
        if: env.EFFECTIVE_PHASE == 'wait_ec2_terminated'
        run: |
          IDS="$EFFECTIVE_INSTANCE_IDS"
          if [ -z "$IDS" ]; then
            echo "Auto-discovering shutting-down/terminated rke2 instances..."
            IDS=$(aws ec2 describe-instances \
              --region $AWS_REGION \
              --filters "Name=instance-state-name,Values=shutting-down,terminated" \
              --query 'Reservations[].Instances[?contains(Tags[?Key==`Name`]|[0].Value,`rke2`)].InstanceId' \
              --output text)
          fi
          echo "Waiting for termination of: $IDS"
          aws ec2 wait instance-terminated --region $AWS_REGION --instance-ids $IDS
          echo "=== CONFIRMED TERMINATED ==="
          aws ec2 describe-instances --region $AWS_REGION --instance-ids $IDS \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name}' \
            --output json
          echo "Live URL: ec2-terminated://confirmed"

      # ────────────────────────────────────────────────────────────────────
      # ALB CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[alb_cleanup] Delete listeners, ALB, ingress target group"
        if: env.EFFECTIVE_PHASE == 'alb_cleanup'
        run: |
          echo "=== DISCOVERING ALBs (rke2-*) ==="
          ALB_ARNS=$(aws elbv2 describe-load-balancers --region $AWS_REGION \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].LoadBalancerArn' \
            --output text)
          echo "ALB ARNs: $ALB_ARNS"
          for ALB_ARN in $ALB_ARNS; do
            echo "Processing ALB: $ALB_ARN"
            LISTENER_ARNS=$(aws elbv2 describe-listeners --region $AWS_REGION \
              --load-balancer-arn $ALB_ARN \
              --query 'Listeners[].ListenerArn' --output text)
            for LISTENER_ARN in $LISTENER_ARNS; do
              aws elbv2 delete-listener --region $AWS_REGION --listener-arn $LISTENER_ARN
              echo "  DELETED listener: $LISTENER_ARN"
            done
            aws elbv2 delete-load-balancer --region $AWS_REGION --load-balancer-arn $ALB_ARN
            echo "  DELETED ALB: $ALB_ARN"
          done
          if [ -z "$ALB_ARNS" ]; then echo "No rke2-* ALBs found."; fi
          echo "Waiting 30s for ALB deletion to settle..."
          sleep 30
          echo "=== DELETING TARGET GROUPS ==="
          TG_ARNS=$(aws elbv2 describe-target-groups --region $AWS_REGION \
            --query 'TargetGroups[?contains(TargetGroupName,`ingress`) || contains(TargetGroupName,`rke2`)].TargetGroupArn' \
            --output text)
          for TG_ARN in $TG_ARNS; do
            aws elbv2 delete-target-group --region $AWS_REGION --target-group-arn $TG_ARN
            echo "  DELETED TG: $TG_ARN"
          done
          if [ -z "$TG_ARNS" ]; then echo "No rke2/ingress TGs found."; fi
          echo "Live URL: alb-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # SECURITY GROUP CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[sg_cleanup] Delete rke2-* security groups (skip default VPC)"
        if: env.EFFECTIVE_PHASE == 'sg_cleanup'
        run: |
          echo "=== DISCOVERING RKE2 SECURITY GROUPS ==="
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=group-name,Values=rke2-*" \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b` && GroupName!=`default`].GroupId' \
            --output text)
          TAG_SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=tag:Name,Values=rke2-*" \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b` && GroupName!=`default`].GroupId' \
            --output text)
          ALL_SGS=$(echo "$SG_IDS $TAG_SG_IDS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "SGs to delete: $ALL_SGS"
          for SG_ID in $ALL_SGS; do
            echo "Processing SG: $SG_ID"
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json)
            if [ "$INGRESS" != "[]" ] && [ -n "$INGRESS" ]; then
              aws ec2 revoke-security-group-ingress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true
            fi
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION \
              --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissionsEgress' --output json)
            if [ "$EGRESS" != "[]" ] && [ -n "$EGRESS" ]; then
              aws ec2 revoke-security-group-egress --region $AWS_REGION \
                --group-id $SG_ID --ip-permissions "$EGRESS" 2>/dev/null || true
            fi
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID
            echo "  DELETED SG: $SG_ID"
          done
          if [ -z "$ALL_SGS" ]; then echo "No rke2-* SGs found outside the default VPC."; fi
          echo "Live URL: sg-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # KEY PAIR CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[keypair_cleanup] Delete rke2-* key pairs"
        if: env.EFFECTIVE_PHASE == 'keypair_cleanup'
        run: |
          KP_NAMES=$(aws ec2 describe-key-pairs --region $AWS_REGION \
            --filters "Name=key-name,Values=rke2*" \
            --query 'KeyPairs[].KeyName' --output text)
          echo "Key pairs to delete: $KP_NAMES"
          for KP_NAME in $KP_NAMES; do
            aws ec2 delete-key-pair --region $AWS_REGION --key-name $KP_NAME
            echo "  DELETED key pair: $KP_NAME"
          done
          if [ -z "$KP_NAMES" ]; then echo "No rke2-* key pairs found."; fi
          echo "Live URL: keypair-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # EBS VOLUME CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[ebs_cleanup] Delete available EBS volumes tagged rke2-* or calculator-*"
        if: env.EFFECTIVE_PHASE == 'ebs_cleanup'
        run: |
          echo "=== ALL AVAILABLE EBS VOLUMES ==="
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --output json --query 'Volumes[].{ID:VolumeId,Size:Size,AZ:AvailabilityZone,Tags:Tags}'
          RKE2_VOLS=$(aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" "Name=tag:Name,Values=rke2-*" \
            --query 'Volumes[].VolumeId' --output text)
          CALC_VOLS=$(aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" "Name=tag:Name,Values=calculator-*" \
            --query 'Volumes[].VolumeId' --output text)
          ALL_VOLS=$(echo "$RKE2_VOLS $CALC_VOLS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "Volumes to delete: $ALL_VOLS"
          for VOL_ID in $ALL_VOLS; do
            aws ec2 delete-volume --region $AWS_REGION --volume-id $VOL_ID
            echo "  DELETED volume: $VOL_ID"
          done
          if [ -z "$ALL_VOLS" ]; then echo "No tagged available EBS volumes found."; fi
          echo "Live URL: ebs-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # ELASTIC IP CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[eip_cleanup] Release unassociated Elastic IPs"
        if: env.EFFECTIVE_PHASE == 'eip_cleanup'
        run: |
          echo "=== ALL ELASTIC IPs ==="
          aws ec2 describe-addresses --region $AWS_REGION --output json
          ALLOC_IDS=$(aws ec2 describe-addresses --region $AWS_REGION \
            --query 'Addresses[?!AssociationId].AllocationId' --output text)
          echo "Unassociated EIPs to release: $ALLOC_IDS"
          for ALLOC_ID in $ALLOC_IDS; do
            aws ec2 release-address --region $AWS_REGION --allocation-id $ALLOC_ID
            echo "  RELEASED EIP: $ALLOC_ID"
          done
          if [ -z "$ALLOC_IDS" ]; then echo "No unassociated EIPs found."; fi
          echo "Live URL: eip-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # IAM ROLE CLEANUP
      # ────────────────────────────────────────────────────────────────────
      - name: "[iam_cleanup] Detach, inline-delete, profile-remove, then delete rke2-*/calculator-* IAM roles"
        if: env.EFFECTIVE_PHASE == 'iam_cleanup'
        run: |
          ROLES=$(aws iam list-roles \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].RoleName' \
            --output text)
          echo "Roles found: $ROLES"
          if [ -z "$ROLES" ]; then echo "No matching IAM roles found."; fi
          for ROLE in $ROLES; do
            echo "=== Processing role: $ROLE ==="
            MANAGED=$(aws iam list-attached-role-policies \
              --role-name $ROLE --query 'AttachedPolicies[].PolicyArn' --output text)
            for POLICY_ARN in $MANAGED; do
              aws iam detach-role-policy --role-name $ROLE --policy-arn $POLICY_ARN
              echo "  DETACHED policy: $POLICY_ARN"
            done
            INLINE=$(aws iam list-role-policies --role-name $ROLE --query 'PolicyNames[]' --output text)
            for POLICY_NAME in $INLINE; do
              aws iam delete-role-policy --role-name $ROLE --policy-name $POLICY_NAME
              echo "  DELETED inline policy: $POLICY_NAME"
            done
            PROFILES=$(aws iam list-instance-profiles-for-role \
              --role-name $ROLE --query 'InstanceProfiles[].InstanceProfileName' --output text)
            for PROFILE_NAME in $PROFILES; do
              aws iam remove-role-from-instance-profile \
                --instance-profile-name $PROFILE_NAME --role-name $ROLE
              echo "  REMOVED from profile: $PROFILE_NAME"
              aws iam delete-instance-profile --instance-profile-name $PROFILE_NAME
              echo "  DELETED profile: $PROFILE_NAME"
            done
            aws iam delete-role --role-name $ROLE
            echo "  DELETED ROLE: $ROLE"
          done
          echo "Live URL: iam-cleanup://complete"

      # ────────────────────────────────────────────────────────────────────
      # VPC SUMMARY — gate before VPC deletion
      # ────────────────────────────────────────────────────────────────────
      - name: "[vpc_summary] Summary of deletions so far; VPC inventory for gate"
        if: env.EFFECTIVE_PHASE == 'vpc_summary'
        run: |
          echo "========================================================"
          echo "  PRE-VPC-DELETION SUMMARY"
          echo "========================================================"
          echo "--- Remaining EC2 (non-terminated) ---"
          aws ec2 describe-instances --region $AWS_REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name,Name:Tags[?Key==`Name`]|[0].Value}' --output json
          echo "--- Remaining ALBs ---"
          aws elbv2 describe-load-balancers --region $AWS_REGION \
            --query 'LoadBalancers[?contains(LoadBalancerName,`rke2`)].{Name:LoadBalancerName}' --output json
          echo "--- Remaining TGs ---"
          aws elbv2 describe-target-groups --region $AWS_REGION \
            --query 'TargetGroups[?contains(TargetGroupName,`ingress`) || contains(TargetGroupName,`rke2`)].{Name:TargetGroupName}' --output json
          echo "--- Remaining SGs (non-default-VPC) ---"
          aws ec2 describe-security-groups --region $AWS_REGION \
            --query 'SecurityGroups[?VpcId!=`vpc-08750793f051e477b`].{ID:GroupId,Name:GroupName,VPC:VpcId}' --output json
          echo "--- Remaining key pairs (rke2*) ---"
          aws ec2 describe-key-pairs --region $AWS_REGION --filters "Name=key-name,Values=rke2*" --output json
          echo "--- Remaining available EBS ---"
          aws ec2 describe-volumes --region $AWS_REGION \
            --filters "Name=status,Values=available" \
            --query 'Volumes[].{ID:VolumeId,Size:Size,Tags:Tags}' --output json
          echo "--- Remaining unassociated EIPs ---"
          aws ec2 describe-addresses --region $AWS_REGION \
            --query 'Addresses[?!AssociationId].{AllocationId:AllocationId,PublicIP:PublicIp}' --output json
          echo "--- Remaining IAM roles (rke2/calculator) ---"
          aws iam list-roles \
            --query 'Roles[?contains(RoleName,`rke2`) || contains(RoleName,`calculator`)].RoleName' --output json
          echo ""
          echo "========================================================"
          echo "  VPC TARGETS FOR DELETION"
          echo "========================================================"
          for VPC_ID in vpc-044a1d577502cb21f vpc-06f8e83384de631d6 vpc-0818d68617434d141; do
            echo "--- VPC: $VPC_ID ---"
            aws ec2 describe-vpcs --region $AWS_REGION --vpc-ids $VPC_ID \
              --query 'Vpcs[0].{ID:VpcId,CIDR:CidrBlock}' --output json 2>/dev/null || echo "$VPC_ID not found"
            echo "Subnets:"
            aws ec2 describe-subnets --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[].{ID:SubnetId,CIDR:CidrBlock,AZ:AvailabilityZone}' --output json
            echo "IGWs:"
            aws ec2 describe-internet-gateways --region $AWS_REGION \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[].{ID:InternetGatewayId}' --output json
            echo "Route tables:"
            aws ec2 describe-route-tables --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'RouteTables[].{ID:RouteTableId,Main:Associations[?Main==`true`]|[0].Main}' --output json
            echo "Security groups:"
            aws ec2 describe-security-groups --region $AWS_REGION \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[].{ID:GroupId,Name:GroupName}' --output json
          done
          echo "DEFAULT VPC (PROTECTED): vpc-08750793f051e477b"
          echo "Live URL: vpc-summary://gate-ready"

      # ────────────────────────────────────────────────────────────────────
      # VPC DELETE — vpc-044a1d577502cb21f
      # ────────────────────────────────────────────────────────────────────
      - name: "[vpc_delete_044a1d577502cb21f] Delete VPC vpc-044a1d577502cb21f"
        if: env.EFFECTIVE_PHASE == 'vpc_delete_044a1d577502cb21f'
        run: |
          VPC_ID="vpc-044a1d577502cb21f"
          echo "=== DELETING VPC: $VPC_ID ==="
          echo "-- SGs --"
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text)
          for SG_ID in $SG_IDS; do
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json)
            if [ "$INGRESS" != "[]" ]; then aws ec2 revoke-security-group-ingress --region $AWS_REGION --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true; fi
            EGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissionsEgress' --output json)
            if [ "$EGRESS" != "[]" ]; then aws ec2 revoke-security-group-egress --region $AWS_REGION --group-id $SG_ID --ip-permissions "$EGRESS" 2>/dev/null || true; fi
            aws ec2 delete-security-group --region $AWS_REGION --group-id $SG_ID && echo "  DELETED SG: $SG_ID"
          done
          echo "-- Subnets --"
          SUBNET_IDS=$(aws ec2 describe-subnets --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[].SubnetId' --output text)
          for SUBNET_ID in $SUBNET_IDS; do
            aws ec2 delete-subnet --region $AWS_REGION --subnet-id $SUBNET_ID && echo "  DELETED subnet: $SUBNET_ID"
          done
          echo "-- IGWs --"
          IGW_IDS=$(aws ec2 describe-internet-gateways --region $AWS_REGION \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[].InternetGatewayId' --output text)
          for IGW_ID in $IGW_IDS; do
            aws ec2 detach-internet-gateway --region $AWS_REGION --internet-gateway-id $IGW_ID --vpc-id $VPC_ID
            aws ec2 delete-internet-gateway --region $AWS_REGION --internet-gateway-id $IGW_ID && echo "  DELETED IGW: $IGW_ID"
          done
          echo "-- Non-main Route Tables --"
          RT_IDS=$(aws ec2 describe-route-tables --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[?!Associations[?Main==`true`]].RouteTableId' --output text)
          for RT_ID in $RT_IDS; do
            aws ec2 delete-route-table --region $AWS_REGION --route-table-id $RT_ID && echo "  DELETED RT: $RT_ID"
          done
          echo "-- Delete VPC --"
          aws ec2 delete-vpc --region $AWS_REGION --vpc-id $VPC_ID
          echo "DELETED VPC: $VPC_ID"
          echo "Live URL: vpc-deleted://vpc-044a1d577502cb21f"

      # ────────────────────────────────────────────────────────────────────
      # VPC DELETE — vpc-06f8e83384de631d6
      # ────────────────────────────────────────────────────────────────────
      - name: "[vpc_delete_06f8e83384de631d6] Delete VPC vpc-06f8e83384de631d6"
        if: env.EFFECTIVE_PHASE == 'vpc_delete_06f8e83384de631d6'
        run: |
          VPC_ID="vpc-06f8e83384de631d6"
          echo "=== DELETING VPC: $VPC_ID ==="
          echo "-- SGs --"
          SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text)
          for SG_ID in $SG_IDS; do
            INGRESS=$(aws ec2 describe-security-groups --region $AWS_REGION --group-ids $SG_ID --query 'SecurityGroups[0].IpPermissions' --output json)
            if [ "$INGRESS" != "[]" ]; then aws ec2 revoke-security-group-ingress --region $AWS_REGION --group-id $SG_ID --ip-permissions "$INGRESS" 2>/dev/null || true; fi
