name: Deploy RKE2 Cluster

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git revision to deploy'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run identifier'
        required: false
        default: ''

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: "1.7.5"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Terraform — provision EC2 x2, ALB, SGs, key pair
  # ────────────────────────────────────────────────────────────────────────────
  terraform:
    name: Terraform — Provision Infrastructure
    runs-on: ubuntu-latest
    outputs:
      alb_dns_name:      ${{ steps.tf-outputs.outputs.alb_dns_name }}
      server_public_ip:  ${{ steps.tf-outputs.outputs.server_public_ip }}
      agent_public_ip:   ${{ steps.tf-outputs.outputs.agent_public_ip }}
      server_private_ip: ${{ steps.tf-outputs.outputs.server_private_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Capture Terraform Outputs
        id: tf-outputs
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          SERVER_IP=$(terraform output -raw server_public_ip)
          AGENT_IP=$(terraform output -raw agent_public_ip)
          SERVER_PRIVATE=$(terraform output -raw server_private_ip)

          echo "alb_dns_name=${ALB_DNS}"         >> "$GITHUB_OUTPUT"
          echo "server_public_ip=${SERVER_IP}"   >> "$GITHUB_OUTPUT"
          echo "agent_public_ip=${AGENT_IP}"     >> "$GITHUB_OUTPUT"
          echo "server_private_ip=${SERVER_PRIVATE}" >> "$GITHUB_OUTPUT"

          echo "ALB DNS: ${ALB_DNS}"
          echo "Server public IP: ${SERVER_IP}"
          echo "Agent public IP:  ${AGENT_IP}"

      - name: Export private key from Terraform
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform output -raw private_key_pem > ../ansible/rke2-key.pem
          chmod 600 ../ansible/rke2-key.pem

      - name: Upload terraform state + key artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: |
            terraform/terraform.tfstate
            terraform/terraform.tfstate.backup
            ansible/rke2-key.pem
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Ansible — bootstrap RKE2 server + agent
  # ────────────────────────────────────────────────────────────────────────────
  ansible:
    name: Ansible — Bootstrap RKE2 Cluster
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Download terraform artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-state

      - name: Restore artifact paths
        run: |
          # artifact downloads to cwd; restore to expected locations
          mv -f terraform.tfstate terraform/ 2>/dev/null || true
          mv -f rke2-key.pem ansible/ 2>/dev/null || true
          chmod 600 ansible/rke2-key.pem

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Build Ansible inventory from Terraform outputs
        run: |
          SERVER_IP="${{ needs.terraform.outputs.server_public_ip }}"
          AGENT_IP="${{ needs.terraform.outputs.agent_public_ip }}"

          mkdir -p ansible/inventory
          cat > ansible/inventory/hosts.ini <<EOF
          [rke2_server]
          ${SERVER_IP} ansible_user=ubuntu ansible_ssh_private_key_file=./rke2-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

          [rke2_agent]
          ${AGENT_IP} ansible_user=ubuntu ansible_ssh_private_key_file=./rke2-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          echo "Inventory written:"
          cat ansible/inventory/hosts.ini

      - name: Wait for EC2 SSH to be available (server)
        run: |
          SERVER_IP="${{ needs.terraform.outputs.server_public_ip }}"
          echo "Waiting for SSH on ${SERVER_IP}..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                   -i ansible/rke2-key.pem ubuntu@${SERVER_IP} 'echo ok' 2>/dev/null; then
              echo "SSH ready on server"
              break
            fi
            echo "Attempt ${i}/30 — sleeping 10s..."
            sleep 10
          done

      - name: Wait for EC2 SSH to be available (agent)
        run: |
          AGENT_IP="${{ needs.terraform.outputs.agent_public_ip }}"
          echo "Waiting for SSH on ${AGENT_IP}..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                   -i ansible/rke2-key.pem ubuntu@${AGENT_IP} 'echo ok' 2>/dev/null; then
              echo "SSH ready on agent"
              break
            fi
            echo "Attempt ${i}/30 — sleeping 10s..."
            sleep 10
          done

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/hosts.ini site.yml -v

      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: ~/.kube/config
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Helm Deploy — ingress-nginx + hello-world
  # ────────────────────────────────────────────────────────────────────────────
  helm-deploy:
    name: Helm — Deploy Ingress + Hello-World
    runs-on: ubuntu-latest
    needs: [terraform, ansible]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Download kubeconfig artifact
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Place kubeconfig
        run: |
          mkdir -p ~/.kube
          mv config ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Add ingress-nginx Helm repo
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Install ingress-nginx (NodePort on 30080)
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -f charts/nginx-ingress/values.yaml \
            --namespace ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Verify ingress-nginx pods
        run: kubectl get pods -n ingress-nginx

      - name: Install hello-world chart
        run: |
          ALB_DNS="${{ needs.terraform.outputs.alb_dns_name }}"
          helm upgrade --install hello-world ./charts/hello-world \
            --set ingress.host=hello.${ALB_DNS} \
            --namespace hello-world \
            --create-namespace \
            --wait \
            --timeout 3m

      - name: Verify hello-world deployment
        run: |
          kubectl get all -n hello-world
          kubectl get ingress -n hello-world

      - name: Print ALB DNS name
        run: |
          ALB_DNS="${{ needs.terraform.outputs.alb_dns_name }}"
          echo "============================================"
          echo "ALB DNS Name: ${ALB_DNS}"
          echo "App URL:      http://hello.${ALB_DNS}"
          echo "============================================"

      - name: Wait for ALB to become healthy (up to 5 minutes)
        run: |
          ALB_DNS="${{ needs.terraform.outputs.alb_dns_name }}"
          echo "Polling http://hello.${ALB_DNS} ..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Host: hello.${ALB_DNS}" \
              --connect-timeout 5 \
              "http://${ALB_DNS}" 2>/dev/null || echo "000")
            echo "Attempt ${i}/30 — HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "ALB is healthy!"
              break
            fi
            sleep 10
          done

      - name: Curl hello-world and print response
        run: |
          ALB_DNS="${{ needs.terraform.outputs.alb_dns_name }}"
          echo "--- Curl output ---"
          curl -v -H "Host: hello.${ALB_DNS}" "http://${ALB_DNS}"
          echo ""
          echo "Live URL: http://hello.${ALB_DNS}"
