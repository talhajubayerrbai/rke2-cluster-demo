apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-world.fullname" . }}-html
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Hello from RKE2!</title></head>
    <body>
      <h1>Hello from RKE2!</h1>
      <p>Deployed via GitHub Actions → Terraform → Ansible → Helm</p>
    </body>
    </html>
