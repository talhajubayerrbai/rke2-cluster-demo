---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - open-iscsi
      - nfs-common
    state: present

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

- name: Write RKE2 server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0644'

- name: Download and install RKE2 server
  ansible.builtin.shell: |
    curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE=server sh -
  args:
    creates: /usr/local/bin/rke2

- name: Enable and start rke2-server service
  ansible.builtin.systemd:
    name: rke2-server.service
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for RKE2 server to be ready (node-token file)
  ansible.builtin.wait_for:
    path: /var/lib/rancher/rke2/server/node-token
    timeout: 300

- name: Wait for kubeconfig to be written
  ansible.builtin.wait_for:
    path: /etc/rancher/rke2/rke2.yaml
    timeout: 120

- name: Read node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/rke2/server/node-token
  register: node_token_b64

- name: Set node token fact
  ansible.builtin.set_fact:
    rke2_node_token: "{{ node_token_b64.content | b64decode | trim }}"

# Share token with agent play via dummy host
- name: Store token in hostvars for agent
  ansible.builtin.add_host:
    name: rke2_token_holder
    rke2_node_token: "{{ rke2_node_token }}"

- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/rke2/rke2.yaml
  register: kubeconfig_b64

- name: Write patched kubeconfig locally (replace 127.0.0.1 with public IP)
  ansible.builtin.copy:
    content: "{{ kubeconfig_b64.content | b64decode | replace('127.0.0.1', ansible_host) }}"
    dest: /tmp/rke2-kubeconfig.yaml
    mode: '0600'
  delegate_to: localhost
  become: false

- name: Ensure ~/.kube directory exists on runner
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Install kubeconfig to runner ~/.kube/config
  ansible.builtin.copy:
    src: /tmp/rke2-kubeconfig.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: '0600'
    remote_src: false
  delegate_to: localhost
  become: false

- name: Add RKE2 binaries to PATH (symlink kubectl)
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link
  ignore_errors: true
