---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - open-iscsi
      - nfs-common
    state: present

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

- name: Write RKE2 agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0644'
  vars:
    rke2_server_ip: "{{ hostvars['rke2_token_holder']['rke2_node_token'] is defined | ternary(hostvars['rke2_token_holder']['rke2_node_token'], '') }}"
    rke2_token: "{{ hostvars['rke2_token_holder']['rke2_node_token'] }}"
    server_private_ip: "{{ groups['rke2_server'][0] }}"

- name: Download and install RKE2 agent
  ansible.builtin.shell: |
    curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE=agent sh -
  args:
    creates: /usr/local/bin/rke2

- name: Enable and start rke2-agent service
  ansible.builtin.systemd:
    name: rke2-agent.service
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for agent to join the cluster
  ansible.builtin.pause:
    seconds: 30
